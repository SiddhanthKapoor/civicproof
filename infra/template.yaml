AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  CivicProof: turns a reported road problem into an evidence-backed case.
  Next.js on AWS Lambda (Lambda Web Adapter, response streaming Function URL),
  DynamoDB for cases, S3 for photos and packet PDFs, Gemini (key in Secrets Manager) with
  Amazon Nova on Bedrock as fallback for the investigator, Textract for scanned uploads,
  CloudWatch logs, metrics, dashboard and an error alarm.

Parameters:
  Planner:
    Type: String
    Default: gemini
    AllowedValues: [gemini, bedrock, rules]
    Description: "gemini = Google Gemini (needs GeminiApiKey); bedrock = a model on Amazon Bedrock; rules = deterministic planner (no model calls)."
  GeminiApiKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: Gemini API key. Stored in AWS Secrets Manager; the function reads it at run time (never sent to the browser).
  GeminiModelId:
    Type: String
    Default: gemini-3-flash-preview
  BedrockModelId:
    Type: String
    Default: apac.amazon.nova-pro-v1:0
    Description: Amazon Bedrock model (inference profile) for the investigator when Planner=bedrock, and the fallback for Gemini runs.
  FallbackToBedrock:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: When Gemini is unavailable (daily quota, persistent overload), continue the investigation on Amazon Bedrock.
  MaxRunsPerDay:
    Type: Number
    Default: 150
    Description: Cap on investigations per day across the whole deployment (protects the Bedrock budget).
  MaxRunsPerCase:
    Type: Number
    Default: 5
  NominatimContact:
    Type: String
    Default: civicproof-hackathon
    Description: Contact string sent to OpenStreetMap Nominatim in the User-Agent, per its usage policy.
  LogRetentionDays:
    Type: Number
    Default: 30
  Cdn:
    Type: String
    Default: "off"
    AllowedValues: ["on", "off"]
    Description: >
      "on" puts CloudFront in front of the Function URL and serves /_next/static from the edge.
      Every Function URL request is a Lambda invocation, so without it one page load spends ~20 of
      them on build assets and throttles wherever account concurrency is low. Left off by default
      because a new AWS account cannot create CloudFront distributions until it is verified, and a
      stack that cannot be created is worse than one missing an optimisation.

Conditions:
  UseCdn: !Equals [!Ref Cdn, "on"]
  HasGeminiKey: !Not [!Equals [!Ref GeminiApiKey, ""]]
  UseBedrockFallback: !Equals [!Ref FallbackToBedrock, "true"]
  GeminiWithoutKey: !And [!Equals [!Ref Planner, "gemini"], !Not [!Condition HasGeminiKey]]

Resources:
  GeminiApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Condition: HasGeminiKey
    Properties:
      Description: Gemini API key for the CivicProof investigator
      SecretString: !Ref GeminiApiKey

  CasesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes: [summary]
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  BlobBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled

  BlobBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BlobBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt BlobBucket.Arn
              - !Sub "${BlobBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: !Ref LogRetentionDays

  AppFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: CivicProof web app and investigation agent
      CodeUri: ../.lambda
      Handler: run.sh
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 2048
      Timeout: 300
      LoggingConfig:
        LogGroup: !Ref AppLogGroup
        LogFormat: Text
      Layers:
        # AWS Lambda Web Adapter (awslabs/aws-lambda-web-adapter), arm64
        - !Sub arn:aws:lambda:${AWS::Region}:753240598075:layer:LambdaAdapterLayerArm64:28
      Environment:
        Variables:
          AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
          AWS_LWA_INVOKE_MODE: response_stream
          AWS_LWA_PORT: "8080"
          AWS_LWA_READINESS_CHECK_PATH: /api/health
          PORT: "8080"
          NODE_ENV: production
          CIVICPROOF_STORE: dynamodb
          CIVICPROOF_TABLE: !Ref CasesTable
          CIVICPROOF_BLOBS: s3
          CIVICPROOF_BUCKET: !Ref BlobBucket
          # Planner=gemini with no key deployed would fail every run: use Amazon Bedrock instead.
          CIVICPROOF_PLANNER: !If [GeminiWithoutKey, "bedrock", !Ref Planner]
          CIVICPROOF_MAX_RUNS_PER_DAY: !Ref MaxRunsPerDay
          CIVICPROOF_MAX_RUNS_PER_CASE: !Ref MaxRunsPerCase
          CIVICPROOF_OCR: textract
          CIVICPROOF_GEOCODER: amazon-location
          GEMINI_SECRET_ARN: !If [HasGeminiKey, !Ref GeminiApiKeySecret, ""]
          GEMINI_MODEL_ID: !Ref GeminiModelId
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          CIVICPROOF_FALLBACK_MODEL: !If [UseBedrockFallback, !Ref BedrockModelId, ""]
          BEDROCK_REGION: !Ref AWS::Region
          NOMINATIM_CONTACT: !Ref NominatimContact
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM
      Policies:
        # Least privilege: one table, one bucket, one secret, one model family, two geocoding calls, Textract OCR.
        - DynamoDBCrudPolicy:
            TableName: !Ref CasesTable
        - S3CrudPolicy:
            BucketName: !Ref BlobBucket
        - Statement:
            - Sid: InvokeInvestigatorModel
              Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource:
                - !Sub arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/${BedrockModelId}
                - arn:aws:bedrock:*::foundation-model/amazon.nova-*
                # Global cross-region inference profiles route to region-less foundation-model ARNs.
                - arn:aws:bedrock:::foundation-model/amazon.nova-*
            # The Gemini key: this one secret, read-only.
            - Sid: ReadGeminiKey
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !If [HasGeminiKey, !Ref GeminiApiKeySecret, !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:civicproof-none"]
            # Amazon Location Service: address search on the report form, and the road at a report's pin.
            - Sid: GeocodeAddresses
              Effect: Allow
              Action:
                - geo-places:Geocode
                - geo-places:ReverseGeocode
              Resource: !Sub arn:aws:geo-places:${AWS::Region}::provider/default
            # Textract text detection has no resource-level permissions; reads S3 with this role.
            - Sid: OcrScannedUploads
              Effect: Allow
              Action:
                - textract:DetectDocumentText
                - textract:StartDocumentTextDetection
                - textract:GetDocumentTextDetection
              Resource: "*"

  # Since Oct 2025 a public Function URL also needs lambda:InvokeFunction, restricted here
  # to invocations that arrive through the URL.
  AppFunctionUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AppFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  AppErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: CivicProof Lambda errors (5+ in 5 minutes)
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - { Name: FunctionName, Value: !Ref AppFunction }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  InvestigationFailuresMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref AppLogGroup
      FilterPattern: '{ $.event = "investigation.failed" }'
      MetricTransformations:
        - MetricNamespace: CivicProof
          MetricName: InvestigationFailures
          MetricValue: "1"

  CedarDenialsMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref AppLogGroup
      FilterPattern: '{ $.event = "investigation.denied" }'
      MetricTransformations:
        - MetricNamespace: CivicProof
          MetricName: InvestigationBudgetDenials
          MetricValue: "1"

  # The investigator's quality and cost at a glance, from the Embedded Metric Format lines each run logs.
  InvestigatorDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${AWS::StackName}-investigator"
      DashboardBody: !Sub |
        {
          "widgets": [
            { "type": "metric", "x": 0, "y": 0, "width": 8, "height": 6,
              "properties": { "title": "Investigations and failures", "region": "${AWS::Region}", "stat": "Sum", "period": 3600,
                "metrics": [ [ { "expression": "SEARCH('{CivicProof,Engine} MetricName=\"Investigations\"', 'Sum', 3600)", "id": "runs" } ],
                             [ { "expression": "SEARCH('{CivicProof,Engine} MetricName=\"InvestigationFailures\"', 'Sum', 3600)", "id": "fails" } ] ] } },
            { "type": "metric", "x": 8, "y": 0, "width": 8, "height": 6,
              "properties": { "title": "Share of model claims the verifier accepted (%)", "region": "${AWS::Region}", "stat": "Average", "period": 3600,
                "metrics": [ [ { "expression": "SEARCH('{CivicProof,Engine} MetricName=\"VerifiedShare\"', 'Average', 3600)", "id": "share" } ] ] } },
            { "type": "metric", "x": 16, "y": 0, "width": 8, "height": 6,
              "properties": { "title": "Run duration (s, p90)", "region": "${AWS::Region}", "stat": "p90", "period": 3600,
                "metrics": [ [ { "expression": "SEARCH('{CivicProof,Engine} MetricName=\"DurationSeconds\"', 'p90', 3600)", "id": "dur" } ] ] } },
            { "type": "metric", "x": 0, "y": 6, "width": 8, "height": 6,
              "properties": { "title": "Policy denials, conflicts, unverified claims", "region": "${AWS::Region}", "stat": "Sum", "period": 3600,
                "metrics": [ [ { "expression": "SEARCH('{CivicProof,Engine} MetricName=\"PolicyDenials\"', 'Sum', 3600)", "id": "deny" } ],
                             [ { "expression": "SEARCH('{CivicProof,Engine} MetricName=\"Conflicts\"', 'Sum', 3600)", "id": "conf" } ],
                             [ { "expression": "SEARCH('{CivicProof,Engine} MetricName=\"UnverifiedClaims\"', 'Sum', 3600)", "id": "unv" } ] ] } },
            { "type": "metric", "x": 8, "y": 6, "width": 8, "height": 6,
              "properties": { "title": "Model calls, waits for rate limits", "region": "${AWS::Region}", "stat": "Sum", "period": 3600,
                "metrics": [ [ { "expression": "SEARCH('{CivicProof,Engine} MetricName=\"ModelCalls\"', 'Sum', 3600)", "id": "calls" } ],
                             [ { "expression": "SEARCH('{CivicProof,Engine} MetricName=\"ModelWaits\"', 'Sum', 3600)", "id": "waits" } ] ] } },
            { "type": "metric", "x": 16, "y": 6, "width": 8, "height": 6,
              "properties": { "title": "Lambda errors and duration", "region": "${AWS::Region}", "period": 300,
                "metrics": [ [ "AWS/Lambda", "Errors", "FunctionName", "${AppFunction}", { "stat": "Sum" } ],
                             [ "AWS/Lambda", "Duration", "FunctionName", "${AppFunction}", { "stat": "p90", "yAxis": "right" } ] ] } }
          ]
        }

  # A CDN in front of the Function URL. Every request to a Function URL is a Lambda invocation,
  # including each of the ~15 hashed chunks a page asks for at once — which throttles the moment the
  # account's concurrency ceiling is low, and returns 429s for assets the page cannot run without.
  # Caching the immutable build output at the edge takes those off the function entirely; everything
  # else is passed straight through uncached, so cases, streaming runs and owner-key requests behave
  # exactly as they do against the function directly.
  CdnDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: UseCdn
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${AWS::StackName} — edge cache for build assets, pass-through for everything else"
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_All
        Origins:
          - Id: FunctionUrlOrigin
            # The Function URL's host, taken from the URL CloudFormation returns.
            DomainName: !Select [2, !Split ["/", !GetAtt AppFunctionUrl.FunctionUrl]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: FunctionUrlOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: true
          # CachingDisabled: pages and APIs are per-case and must never be served from a shared cache.
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          # AllViewerExceptHostHeader: forwards x-owner-key and the rest, but keeps the origin's own
          # Host — a Function URL rejects a request carrying the viewer's Host.
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
        CacheBehaviors:
          # Hashed, immutable build output: fetched from the function once, then served from the edge.
          - PathPattern: /_next/static/*
            TargetOriginId: FunctionUrlOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          - PathPattern: /icons/*
            TargetOriginId: FunctionUrlOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

Outputs:
  AppUrl:
    Description: Public URL of the app
    Value: !If [UseCdn, !Sub "https://${CdnDistribution.DomainName}/", !GetAtt AppFunctionUrl.FunctionUrl]
  FunctionUrl:
    Description: The Lambda Function URL itself (the CDN origin when Cdn=on)
    Value: !GetAtt AppFunctionUrl.FunctionUrl
  TableName:
    Value: !Ref CasesTable
  BucketName:
    Value: !Ref BlobBucket
  LogGroup:
    Value: !Ref AppLogGroup
  Dashboard:
    Description: CloudWatch dashboard for the investigator
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${AWS::StackName}-investigator"
